name: Windows runner release

on:
  push:
    tags:
      - "runner-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example runner-v4)"
        required: true
        default: "runner-v4"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/requirements.txt

      - name: Install runner build dependencies
        run: python -m pip install -r runner/requirements.txt pyinstaller

      - name: Run runner protocol tests
        run: python -m unittest discover -s runner -p "test_*.py"

      - name: Build Windows executable
        working-directory: runner
        run: pyinstaller --clean --onefile --noconsole --name ggparrot-runner macro_runner.py

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash runner/dist/ggparrot-runner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ggparrot-runner.exe" | Set-Content runner/dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggparrot-runner-windows
          path: |
            runner/dist/ggparrot-runner.exe
            runner/dist/SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title $tag --generate-notes
          }
          gh release upload $tag runner/dist/ggparrot-runner.exe runner/dist/SHA256SUMS.txt --clobber
