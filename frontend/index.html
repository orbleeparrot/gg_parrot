<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>껄무새 · 코인 매크로 백테스트</title>

    <!-- Favicon — 전달받은 세트(껄무새_이미지_20260831/favicon)를 그대로 사용.
         manifest.json 이 android-icon-*.png 를 상대경로로 참조하므로 폴더째 둔다. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="57x57" href="/favicon/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/favicon/apple-icon-60x60.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/favicon/apple-icon-76x76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/favicon/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/favicon/apple-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/favicon/apple-icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon/apple-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-icon-180x180.png" />
    <!-- sizes 없는 기본값 — 위 목록에 맞는 크기가 없을 때 iOS 가 이걸 집는다.
         구형 iOS 는 precomposed 를 우선한다(아이콘에 광택을 덧입히지 않음). -->
    <link rel="apple-touch-icon" href="/favicon/apple-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/favicon/apple-icon-precomposed.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-icon-512x512.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="manifest" href="/favicon/manifest.json" />
    <meta name="theme-color" content="#FCD535" />

    <!-- SNS 공유 (Open Graph). og:image 는 절대 URL 이어야 크롤러가 읽는다.
         배포 도메인이 바뀌면 아래 3곳의 호스트만 고치면 된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="껄무새" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="껄무새 · 코인 매크로 백테스트" />
    <meta
      property="og:description"
      content="코린이도 쉽게 시작하는 코인 매크로. 전략을 만들고 과거 데이터로 돌려본 뒤 모의로 굴려봐요. 실거래가 아닌 교육용 시뮬레이션이에요."
    />
    <meta property="og:image" content="https://gg-parrot.vercel.app/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://gg-parrot.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="껄무새 · 코인 매크로 백테스트" />
    <meta
      name="twitter:description"
      content="코린이도 쉽게 시작하는 코인 매크로. 전략을 만들고 과거 데이터로 돌려본 뒤 모의로 굴려봐요."
    />
    <meta name="twitter:image" content="https://gg-parrot.vercel.app/share.png" />
    <script>
      // Apply the saved theme BEFORE first paint, otherwise dark-mode users get
      // a white flash while the bundle loads. Kept inline and tiny on purpose;
      // the source of truth for the key/values is src/lib/theme.js.
      (function () {
        try {
          var p = localStorage.getItem("ggp_theme") || "system";
          var dark =
            p === "dark" ||
            (p === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
