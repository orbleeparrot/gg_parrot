<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f11">
  <title>연결 확인 · 껄무새</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b0f11; color: #e9ecef; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { padding: 32px 24px; max-width: 380px; }
    .brand { color: #ffdd2d; font-weight: 800; font-size: 18px; margin-bottom: 36px; }
    h1 { font-size: 24px; line-height: 1.4; letter-spacing: -.04em; }
    p { color: #b2bbc2; font-size: 16px; line-height: 1.6; }
    button { margin-top: 16px; padding: 12px 22px; border: 0; border-radius: 10px; background: #ffdd2d; color: #121619; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="brand">껄무새</div>
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
