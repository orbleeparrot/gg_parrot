# 참고용 단독 worker 예시입니다. 실제 루트 render.yaml에도 같은 worker가 포함되어
# 있으므로 Blueprint 배포 시 이 파일을 별도로 적용하지 마세요.
services:
  - type: worker
    name: gg-parrot-position-news
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile.prefect
    dockerContext: backend
    dockerCommand: python -m app.workflows.position_news serve
    maxShutdownDelaySeconds: 300
    envVars:
      - key: POSITION_NEWS_REQUIRE_POSTGRES
        value: "true"
      - key: POSITION_NEWS_COLLECTION_SECONDS
        value: "300"
      - key: POSITION_NEWS_SCHEDULE_SECONDS
        value: "60"
      - key: POSITION_NEWS_BROWSER_ENRICHMENT_ENABLED
        value: "true"
      - key: POSITION_NEWS_BROWSER_BUDGET_SECONDS
        value: "90"
      - key: POSITION_NEWS_BROWSER_PAGE_BUDGET_SECONDS
        value: "15"
      - key: POSITION_NEWS_BROWSER_MAX_LOAD_MORE_CLICKS
        value: "2"
      - key: POSITION_NEWS_BROWSER_CONCURRENCY
        value: "1"
      - key: POSITION_NEWS_TRANSLATION_MAX_CALLS_PER_DAY
        value: "10"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_RUN
        value: "2"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_DAY
        value: "10"
      - key: COINDESK_PLAYWRIGHT_ENABLED
        value: "true"
      - key: COINDESK_PLAYWRIGHT_TIMEOUT_MS
        value: "15000"
      - key: DATABASE_URL
        sync: false
      - key: PREFECT_API_URL
        sync: false
      - key: PREFECT_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5"
      - key: ANTHROPIC_POSITION_NEWS_MAX_TOKENS
        value: "512"
