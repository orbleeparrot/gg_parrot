# Render Blueprint — FastAPI 웹 + Prefect 포지션 뉴스 워커 배포용.
# Render 대시보드에서 "New +" → "Blueprint" → 이 레포(gg_parrot) 선택 시 자동 인식됩니다.
# (수동 생성해도 됨: New Web Service → 아래 rootDir/build/start 값 그대로 입력)
services:
  - type: web
    name: gg-parrot            # 배포 URL이 https://gg-parrot.onrender.com 이 됩니다.
    runtime: python            # 이름이 이미 쓰였다면 접미사가 붙을 수 있으니, 실제 URL을 확인 후
    rootDir: backend           # frontend/vercel.json 의 destination 도 그 URL로 맞추세요.
    plan: starter              # 유료 상시 실행 플랜. 무료 web을 선택하면 유휴 시
                               # 잠들 수 있지만 worker에는 무료 플랜이 없습니다.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Market candles are reproducible public data; retain them across restarts.
    # This disk belongs to this single web instance, not the news worker.
    disk:
      name: market-cache
      mountPath: /var/data/market-cache
      sizeGB: 1
    envVars:
      # DATABASE_URL 은 Supabase 트랜잭션 모드 풀러(:6543) — 연결을 트랜잭션 동안만 빌려 써서 접속자 수 15 제한을
      # 받지 않는다(2026-10-09, GG-011: 세션 모드에선 프로세스가 연결을 평생 쥐어 웹 풀 2개가 몰릴 때 바닥났다).
      # 웹: 일반 요청 4 + heartbeat 예약 1 (트랜잭션 모드) + LISTEN 1 (세션 모드, DATABASE_SESSION_URL).
      - key: DATABASE_POOL_SIZE
        value: "4"
      - key: DATABASE_RUNNER_POOL_SIZE
        value: "1"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "2"
      - key: DATABASE_RUNNER_POOL_TIMEOUT_SECONDS
        value: "1"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: MARKET_CACHE_DIR
        value: /var/data/market-cache
      - key: POSITION_NEWS_EMBEDDED_ENABLED
        value: "true"
      - key: POSITION_NEWS_EMBEDDED_BOOTSTRAP_ONLY
        value: "true"
      - key: POSITION_NEWS_COLLECTION_SECONDS
        value: "300"
      - key: POSITION_NEWS_EXTRA_RSS_ENABLED
        value: "true"
      # Optional COINDESK_API_KEY: add in the dashboard after confirming news/display access.
      - key: COINDESK_NEWS_MAX_CALLS_PER_DAY
        value: "20"
      - key: COINDESK_NEWS_MAX_TOTAL_CALLS
        value: "100"
      - key: COINDESK_NEWS_CACHE_SECONDS
        value: "1800"
      - key: POSITION_NEWS_BROWSER_ENRICHMENT_ENABLED
        value: "false"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_RUN
        value: "2"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_DAY
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # api.binance.com 은 미국 IP를 차단 → Render(미국 리전)에선 공개 데이터
      # 미러 호스트를 사용(동일한 공개 시세). 로컬은 이 변수 없이 기본 호스트 사용.
      - key: BINANCE_API_BASE
        value: "https://data-api.binance.vision"
      - key: RUNNER_DOWNLOAD_URL
        value: "https://github.com/orbleeparrot/gg_parrot/releases/download/runner-v10/ggparrot-runner.exe"
      - key: RUNNER_EXE_VERSION
        value: "10"
      - key: RUNNER_SUPPORTS_LAUNCH
        value: "true"
      - key: RUNNER_MIN_VERSION
        value: "6"
      # 대시보드에서 실제 값을 입력합니다. 비밀값은 Blueprint에 커밋하지 않습니다.
      # DATABASE_URL = 트랜잭션 모드 풀러(…pooler.supabase.com:6543), DATABASE_SESSION_URL = 같은 주소의 세션 모드(:5432) —
      # LISTEN 연결 하나만 세션 모드를 쓴다. 세션 주소를 비우고 DATABASE_URL 이 :6543 이면 LISTEN 은 건너뛰고 폴링만 남는다.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SESSION_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Google Identity Services의 공개 OAuth 2.0 Web client ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # OpenAI 설정을 AI 해설·요약과 코인동향 제목 번역이 함께 사용합니다.
      # 중복 제목은 Postgres 캐시를 재사용하고, 새 영문 제목은 전부 번역합니다.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-6-luna"
      - key: OPENAI_REASONING_TOKEN_RESERVE
        value: "4096"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      # 코인동향은 시장 1건 + 종목 2건만 동시에 요청하고, AI 포화 시에는
      # 웹 요청 스레드를 오래 점유하지 않도록 짧게 대기한 뒤 재시도 응답을 줍니다.
      - key: AI_ACQUIRE_TIMEOUT_SECONDS
        value: "1"
      - key: AI_EXPLAIN_MAX_CALLS_PER_DAY
        value: "20"
      # 껄무새에게 물어볼까? — 계정당 하루 횟수와 후보 백테스트 시간 예산(초). 넘으면 남은 후보는 건너뜁니다.
      - key: ASK_DAILY_LIMIT
        value: "5"
      - key: ASK_TIME_BUDGET_SEC
        value: "20"
      - key: NEWS_MARKET_SUMMARY_MAX_CALLS_PER_DAY
        value: "2"
      - key: OPENAI_NEWS_TRANSLATION_MAX_TOKENS
        value: "2048"

  # Prefect Cloud가 실행 이력과 스케줄을 관리하고, 실제 RSS 수집/DB 저장은
  # 이 Render 프로세스가 수행합니다. Background Worker에는 HTTP health check가 없습니다.
  - type: worker
    name: gg-parrot-position-news
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile.prefect
    dockerContext: backend
    dockerCommand: python -m app.workflows.position_news serve
    maxShutdownDelaySeconds: 300
    envVars:
      # 프로세스마다 2 — supervisor 2 + 격리 뉴스 자식 프로세스 2 = 최대 4 (트랜잭션 모드라 접속자 수 한도 15를
      # 차지하지 않는다 — 실제 Postgres 연결은 트랜잭션이 도는 동안만 쓴다. 세션 모드로 남는 건 웹의 LISTEN 1개뿐).
      # 1개일 때는 한 프로세스 안의 수집기끼리 2초 대기에 걸려 시간당 1~3건 실패했다(2026-10-09).
      - key: DATABASE_POOL_SIZE
        value: "2"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "2"
      - key: POSITION_NEWS_REQUIRE_POSTGRES
        value: "true"
      - key: POSITION_NEWS_COLLECTION_SECONDS
        value: "300"
      - key: POSITION_NEWS_SCHEDULE_SECONDS
        value: "60"
      - key: POSITION_NEWS_EXTRA_RSS_ENABLED
        value: "true"
      # Optional COINDESK_API_KEY: never commit the key or put it in browser variables.
      - key: COINDESK_NEWS_MAX_CALLS_PER_DAY
        value: "20"
      - key: COINDESK_NEWS_MAX_TOTAL_CALLS
        value: "100"
      - key: COINDESK_NEWS_CACHE_SECONDS
        value: "1800"
      - key: POSITION_NEWS_BROWSER_ENRICHMENT_ENABLED
        value: "true"
      - key: POSITION_NEWS_BROWSER_BUDGET_SECONDS
        value: "90"
      - key: POSITION_NEWS_BROWSER_PAGE_BUDGET_SECONDS
        value: "15"
      - key: POSITION_NEWS_BROWSER_MAX_LOAD_MORE_CLICKS
        value: "2"
      - key: POSITION_NEWS_BROWSER_CONCURRENCY
        value: "1"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_RUN
        value: "2"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_DAY
        value: "10"
      - key: POSITION_NEWS_MAX_AI_SUMMARY_ITEMS
        value: "3"
      - key: COINDESK_PLAYWRIGHT_ENABLED
        value: "true"
      - key: COINDESK_PLAYWRIGHT_TIMEOUT_MS
        value: "15000"
      - key: POSITION_NEWS_ARTICLE_PLAYWRIGHT_ENABLED
        value: "false"
      - key: POSITION_NEWS_ARTICLE_TIMEOUT_MS
        value: "12000"
      # 웹 서비스와 정확히 같은 Supabase 트랜잭션 모드 풀러 URL(:6543)을 입력합니다. 이 워커는 LISTEN 을 하지 않는다.
      - key: DATABASE_URL
        sync: false
      - key: PREFECT_API_URL
        sync: false
      - key: PREFECT_API_KEY
        sync: false
      # 선택 사항입니다. 비워 두면 규칙 기반 분석만 저장합니다.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-6-luna"
      - key: OPENAI_REASONING_TOKEN_RESERVE
        value: "4096"
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: OPENAI_POSITION_NEWS_MAX_TOKENS
        value: "512"
