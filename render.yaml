# Render Blueprint — FastAPI 웹 + Prefect 포지션 뉴스 워커 배포용.
# Render 대시보드에서 "New +" → "Blueprint" → 이 레포(gg_parrot) 선택 시 자동 인식됩니다.
# (수동 생성해도 됨: New Web Service → 아래 rootDir/build/start 값 그대로 입력)
services:
  - type: web
    name: gg-parrot            # 배포 URL이 https://gg-parrot.onrender.com 이 됩니다.
    runtime: python            # 이름이 이미 쓰였다면 접미사가 붙을 수 있으니, 실제 URL을 확인 후
    rootDir: backend           # frontend/vercel.json 의 destination 도 그 URL로 맞추세요.
    plan: starter              # 유료 상시 실행 플랜. 무료 web을 선택하면 유휴 시
                               # 잠들 수 있지만 worker에는 무료 플랜이 없습니다.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # api.binance.com 은 미국 IP를 차단 → Render(미국 리전)에선 공개 데이터
      # 미러 호스트를 사용(동일한 공개 시세). 로컬은 이 변수 없이 기본 호스트 사용.
      - key: BINANCE_API_BASE
        value: "https://data-api.binance.vision"
      - key: RUNNER_DOWNLOAD_URL
        value: "https://github.com/orbleeparrot/gg_parrot/releases/download/runner-v5/ggparrot-runner.exe"
      - key: RUNNER_EXE_VERSION
        value: "5"
      - key: RUNNER_SUPPORTS_LAUNCH
        value: "true"
      - key: RUNNER_MIN_VERSION
        value: "5"
      # 대시보드에서 실제 값을 입력합니다. 비밀값은 Blueprint에 커밋하지 않습니다.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # Google Identity Services의 공개 OAuth 2.0 Web client ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # 기존 Anthropic 설정을 AI 요약과 코인동향 제목 번역이 함께 사용합니다.
      # 중복 제목은 Postgres 캐시를 재사용하고, 새 영문 제목은 전부 번역합니다.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5"
      # 코인동향은 시장 1건 + 종목 2건만 동시에 요청하고, AI 포화 시에는
      # 웹 요청 스레드를 오래 점유하지 않도록 짧게 대기한 뒤 재시도 응답을 줍니다.
      - key: AI_ACQUIRE_TIMEOUT_SECONDS
        value: "1"
      - key: AI_EXPLAIN_MAX_CALLS_PER_DAY
        value: "20"
      - key: NEWS_MARKET_SUMMARY_MAX_CALLS_PER_DAY
        value: "3"
      - key: ANTHROPIC_NEWS_TRANSLATION_MAX_TOKENS
        value: "2048"

  # Prefect Cloud가 실행 이력과 스케줄을 관리하고, 실제 RSS 수집/DB 저장은
  # 이 Render 프로세스가 수행합니다. Background Worker에는 HTTP health check가 없습니다.
  - type: worker
    name: gg-parrot-position-news
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile.prefect
    dockerContext: backend
    dockerCommand: python -m app.workflows.position_news serve
    maxShutdownDelaySeconds: 300
    envVars:
      - key: POSITION_NEWS_REQUIRE_POSTGRES
        value: "true"
      - key: POSITION_NEWS_COLLECTION_SECONDS
        value: "60"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_RUN
        value: "2"
      - key: POSITION_NEWS_MAX_AI_ANALYSES_PER_DAY
        value: "10"
      - key: POSITION_NEWS_MAX_AI_SUMMARY_ITEMS
        value: "3"
      - key: COINDESK_PLAYWRIGHT_ENABLED
        value: "true"
      - key: COINDESK_PLAYWRIGHT_TIMEOUT_MS
        value: "15000"
      - key: POSITION_NEWS_ARTICLE_PLAYWRIGHT_ENABLED
        value: "true"
      - key: POSITION_NEWS_ARTICLE_TIMEOUT_MS
        value: "12000"
      # 웹 서비스와 정확히 같은 Supabase Session Pooler URL을 입력합니다.
      - key: DATABASE_URL
        sync: false
      - key: PREFECT_API_URL
        sync: false
      - key: PREFECT_API_KEY
        sync: false
      # 선택 사항입니다. 비워 두면 규칙 기반 분석만 저장합니다.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-haiku-4-5"
      - key: ANTHROPIC_POSITION_NEWS_MAX_TOKENS
        value: "256"
